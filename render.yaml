# Render.com Blueprint — Free Tier Deployment
blueprintName: ghost
services:
  - type: web
    name: ghost
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GHOST_ACCOUNTS_JSON
        sync: false # Set securely via the Render Dashboard UI
      - key: GHOST_THREADS_JSON
        value: "[]"
      - key: HTTP_PROXY
        sync: false # Set custom proxy if Cloudflare Turnstile blocks datacenter IPs
      - key: HTTPS_PROXY
        sync: false # Set custom proxy if Cloudflare Turnstile blocks datacenter IPs

